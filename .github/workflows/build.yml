name: Build Docker

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: cd backend && uv sync --group dev
      - name: Lint
        run: cd backend && uv run ruff check src
      - name: Type check
        run: cd backend && uv run mypy src
      - name: Test
        run: |
          mkdir -p backend/config
          cd backend && uv run pytest src/test -v -m "not e2e"

  webui-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: cd webui && pnpm install

      - name: Lint
        run: cd webui && pnpm lint

      - name: Unit test
        run: cd webui && pnpm test

      - name: build test
        run: |
          cd webui && pnpm test:build

  version-info:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: If release
        id: release
        run: |
          if [[ '${{ github.event_name }}' == 'pull_request' && '${{ github.event.pull_request.head.ref }}' == *'dev'* ]]; then
            if [ ${{ github.event.pull_request.merged }} == true ]; then
              echo "release=1" >> $GITHUB_OUTPUT
            else
              echo "release=0" >> $GITHUB_OUTPUT
            fi
          elif [[ '${{ github.event_name }}' == 'push' && (${{ github.ref }} == *'alpha'* || ${{ github.ref }} == *'beta'*) ]]; then
            echo "release=1" >> $GITHUB_OUTPUT
          elif [[ '${{ github.event_name }}' == 'push' && ${{ github.ref_name }} == 'main' ]]; then
            echo "release=1" >> $GITHUB_OUTPUT
          else
            echo "release=0" >> $GITHUB_OUTPUT
          fi
      - name: If dev
        id: dev
        run: |
          if [[ '${{ github.event_name }}' == 'push' && (${{ github.ref }} == *'alpha'* || ${{ github.ref }} == *'beta'*) ]]; then
            echo "dev=1" >> $GITHUB_OUTPUT
          else
            echo "dev=0" >> $GITHUB_OUTPUT
          fi
      - name: Check version
        id: version
        run: |
          if [ '${{ github.event_name }}' == 'pull_request' ]; then
            if [ ${{ github.event.pull_request.merged }} == true ]; then
              echo "version=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
            else
              echo "version=Test" >> $GITHUB_OUTPUT
            fi
          elif [[ ${{ github.event_name }} == 'push' && (${{ github.ref }} == *'alpha'* || ${{ github.ref }} == *'beta'*) ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [[ ${{ github.event_name }} == 'push' && ${{ github.ref_name }} == 'main' ]]; then
            SHORT_SHA="${GITHUB_SHA::7}"
            echo "version=main-${SHORT_SHA}" >> $GITHUB_OUTPUT
          else
            echo "version=Test" >> $GITHUB_OUTPUT
          fi
      - name: Check result
        run: |
          echo "release: ${{ steps.release.outputs.release }}"
          echo "dev: ${{ steps.dev.outputs.dev }}"
          echo "version: ${{ steps.version.outputs.version }}"
    outputs:
      release: ${{ steps.release.outputs.release }}
      dev: ${{ steps.dev.outputs.dev }}
      version: ${{ steps.version.outputs.version }}

  build-webui:
    runs-on: ubuntu-latest
    needs: [test, webui-test, version-info]
    if: ${{ needs.version-info.outputs.release == 1 || needs.version-info.outputs.dev == 1 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: cd webui && pnpm install

      - name: Build
        run: |
          cd webui && pnpm build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: webui/dist

  build-docker:
    runs-on: ubuntu-latest
    needs: [build-webui, version-info]
    if: ${{ needs.version-info.outputs.release == 1 || needs.version-info.outputs.dev == 1 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Version info via tag
        working-directory: ./backend/src
        run: |
          echo ${{ needs.version-info.outputs.version }}
          echo "VERSION='${{ needs.version-info.outputs.version }}'" >> module/__version__.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata main
        if: ${{ needs.version-info.outputs.release == 1 && needs.version-info.outputs.dev != 1 }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.USERNAME }}/auto_bangumi
          tags: |
            type=raw,value=${{ needs.version-info.outputs.version }}
            type=raw,value=latest

      - name: Docker metadata dev
        if: ${{ needs.version-info.outputs.dev == 1 }}
        id: meta-dev
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.USERNAME }}/auto_bangumi
          tags: |
            type=raw,value=${{ needs.version-info.outputs.version }}
            type=raw,value=dev-latest

      - name: Login to DockerHub
        if: ${{ needs.version-info.outputs.release == 1 }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.ACCESS_TOKEN }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: backend/src/dist

      - name: Build and push
        if: ${{ needs.version-info.outputs.release == 1 && needs.version-info.outputs.dev != 1 }}
        uses: docker/build-push-action@v6
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          push: True
          build-args: |
            VERSION=${{ needs.version-info.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,scope=${{ github.workflow }},ignore-error=true

      - name: Build and push dev
        if: ${{ needs.version-info.outputs.dev == 1 }}
        uses: docker/build-push-action@v6
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          build-args: |
            VERSION=${{ needs.version-info.outputs.version }}
          tags: ${{ steps.meta-dev.outputs.tags }}
          labels: ${{ steps.meta-dev.outputs.labels }}
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,scope=${{ github.workflow }},ignore-error=true

      - name: Build test
        if: ${{ needs.version-info.outputs.release == 0 }}
        uses: docker/build-push-action@v6
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ needs.version-info.outputs.version }}
          tags: ${{ secrets.USERNAME }}/auto_bangumi:test
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,scope=${{ github.workflow }},ignore-error=true

  release:
    runs-on: ubuntu-latest
    needs: [build-docker, version-info]
    if: ${{ needs.version-info.outputs.release == 1 }}
    outputs:
      url: ${{ steps.release.outputs.url }}
      version: ${{ needs.version-info.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact webui
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: webui/dist

      - name: Zip webui
        run: |
          cd webui && ls -al && tree && zip -r dist.zip dist

      - name: Download artifact app
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: backend/src/dist

      - name: Create Version info via tag
        working-directory: ./backend/src
        run: |
          echo ${{ needs.version-info.outputs.version }}
          echo "VERSION='${{ needs.version-info.outputs.version }}'" >> module/__version__.py

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Generate requirements.txt for non-uv consumers (#994)
        run: |
          cd backend && uv export --format requirements-txt --no-hashes --no-dev -o requirements.txt

      - name: Zip app
        run: |
          cd backend && zip -r app-v${{ needs.version-info.outputs.version }}.zip \
            src pyproject.toml uv.lock requirements.txt

      # 在线自动更新 bundle：module 源码树 + pyproject/uv.lock + 前端 dist + manifest。
      # 同时产出 .sha256（客户端下载后据此校验完整性）。min_image_version 是能应用
      # 此 bundle 布局的最低镜像版本（引入在线更新的首个版本）。
      - name: Build update bundle
        run: |
          VERSION="${{ needs.version-info.outputs.version }}"
          MIN_IMAGE_VERSION="3.3.0-beta.1"
          STAGE="bundle_stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/backend/src" "$STAGE/webui-dist"
          cp -r backend/src/module "$STAGE/backend/src/module"
          cp backend/pyproject.toml backend/uv.lock "$STAGE/backend/"
          cp -r webui/dist/. "$STAGE/webui-dist/"
          LOCK_SHA=$(sha256sum backend/uv.lock | awk '{print $1}')
          cat > "$STAGE/manifest.json" <<EOF
          {
            "version": "$VERSION",
            "min_image_version": "$MIN_IMAGE_VERSION",
            "lockfile_sha256": "$LOCK_SHA",
            "notes": "See release notes."
          }
          EOF
          ( cd "$STAGE" && zip -r "../update-bundle-${VERSION}.zip" backend webui-dist manifest.json )
          sha256sum "update-bundle-${VERSION}.zip" | awk '{print $1}' > "update-bundle-${VERSION}.zip.sha256"

      # 对 bundle 做 ed25519 签名（私钥在 UPDATE_SIGNING_KEY secret，公钥随镜像
      # 分发）。客户端 apply 前验签，boot_overlay 每次启动重新验签——没有 .sig
      # 的 release 会被更新器拒绝，所以签名失败必须让构建失败。
      #
      # 自用 fork（方案 B）：未配置 UPDATE_SIGNING_KEY 时跳过签名，写一个空
      # .sig 占位避免 Release 附件名出问题；配套修改 signing.py 和
      # boot_overlay.py 在公钥缺失 / sig 为空时跳过验签。
      - name: Sign update bundle
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          VERSION="${{ needs.version-info.outputs.version }}"
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            uv run --no-project --with cryptography python -c '
          import base64, os, sys
          from pathlib import Path
          from cryptography.hazmat.primitives.serialization import load_pem_private_key
          bundle = Path(sys.argv[1])
          key = load_pem_private_key(os.environ["UPDATE_SIGNING_KEY"].encode(), password=None)
          sig = key.sign(bundle.read_bytes())
          Path(str(bundle) + ".sig").write_text(base64.b64encode(sig).decode() + "\n")
          print(f"signed {bundle}")
          ' "update-bundle-${VERSION}.zip"
          else
            : > "update-bundle-${VERSION}.zip.sig"
            echo "UPDATE_SIGNING_KEY is not configured; wrote empty placeholder .sig (scheme B for self-hosted forks)."
          fi

      - name: Generate Release info
        id: release-info
        run: |
          if ${{ needs.version-info.outputs.dev == 1 }}; then
            echo "version=🌙${{ needs.version-info.outputs.version }}" >> $GITHUB_OUTPUT
            echo "pre_release=true" >> $GITHUB_OUTPUT
          else
            echo "version=🌟${{ needs.version-info.outputs.version }}" >> $GITHUB_OUTPUT
            echo "pre_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Read changelog
        id: changelog
        run: |
          VERSION="${{ needs.version-info.outputs.version }}"
          if [[ "$VERSION" =~ ^([0-9]+\.[0-9]+) ]]; then
            CHANGELOG_FILE="docs/changelog/${BASH_REMATCH[1]}.md"
            if [ -f "$CHANGELOG_FILE" ]; then
              {
                echo "body<<EOF"
                cat "$CHANGELOG_FILE"
                echo "EOF"
              } >> $GITHUB_OUTPUT
            fi
          fi


